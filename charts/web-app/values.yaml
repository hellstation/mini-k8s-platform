nameOverride: fofatafo
fullnameOverride: ""

replicaCount: 2

image:
  repository: qusakabi/fofatafo
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: nginx
  host: fofatafo.local
  path: /
  pathType: Prefix
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 100Mi
  limits:
    cpu: 250m
    memory: 200Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

config:
  SITE_TITLE: "My Fofatafo Gallery"
  IMAGE_PATH: "/images"

probes:
  readiness:
    enabled: true
    path: /
    port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    enabled: true
    path: /
    port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 2
    failureThreshold: 3
