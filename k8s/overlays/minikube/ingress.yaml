apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fofatafo-ingress
  labels:
    app: fofatafo
spec:
  ingressClassName: nginx
  rules:
    - host: fofatafo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fofatafo
                port:
                  number: 80
