apiVersion: apps/v1
kind: Deployment
metadata:
  name: fofatafo
  labels:
    app: fofatafo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fofatafo
  template:
    metadata:
      labels:
        app: fofatafo
    spec:
      containers:
        - name: fofatafo
          image: qusakabi/fofatafo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fofatafo-config
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "250m"
              memory: "200Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
